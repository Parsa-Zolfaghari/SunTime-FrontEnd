<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="../../assets/img/svg/st p1.svg">
    <link rel="stylesheet" href="../../styles/base/font.css">
    <link rel="stylesheet" href="../../styles/utilities/animate.css">
    <link rel="stylesheet" href="../../styles/base/default.css">
    <link rel="stylesheet" href="../../styles/features/auth/auth.css">
    <link rel="stylesheet" href="../../assets/vendor/fontawesome/css/all.min.css">
    <title>صفحه فراموشی رمز عبور | گالری سان تایم</title>
</head>

<body>
    <main class="auth-page">

        <section class="auth-card">

            <!-- =========================
                 Header
            ========================== -->

            <header class="auth-header">

                <div class="auth-icon" aria-hidden="true">

                    <img src="../../assets/img/svg/st p1.svg" alt="">

                </div>


                <h1>
                    فراموشی رمز عبور
                </h1>


                <p>
                    ایمیل خود را وارد کنید
                </p>

            </header>


            <!-- =========================
                 Forgot Password Form
            ========================== -->

            <form class="auth-form" id="forgotPasswordForm" novalidate>

                <!-- Email -->

                <div class="form-group">

                    <label for="forgotPasswordEmail">
                        ایمیل
                    </label>

                    <input type="email" id="forgotPasswordEmail" name="email" placeholder="example@email.com"
                        autocomplete="email" required>

                </div>


                <!-- Submit -->

                <button type="submit" class="auth-submit" id="forgotPasswordSubmit">

                    <span>
                        ارسال لینک بازیابی
                    </span>

                    <!-- Send Icon -->

                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <path d="M21 3L10 14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                            stroke-linejoin="round" />

                        <path d="M21 3L14 21L10 14L3 10L21 3Z" stroke="currentColor" stroke-width="1.8"
                            stroke-linecap="round" stroke-linejoin="round" />

                    </svg>

                </button>

            </form>


            <!-- =========================
                 Back To Login
            ========================== -->

            <footer class="auth-footer">

                <a href="./Sign-In.html">
                    بازگشت به ورود
                </a>

            </footer>

        </section>
        <div class="bubbles">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
        </div>
    </main>

</body>
<script src="../../src/Components/navBar.js"></script>
<script src="../../src/Components/searchBar.js"></script>
</html>
