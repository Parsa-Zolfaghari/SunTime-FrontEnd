<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="../../assets/img/svg/st p1.svg">
    <link rel="stylesheet" href="../../styles/base/font.css">
    <link rel="stylesheet" href="../../assets/vendor/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="../../styles/features/auth/auth.css">
    <title>صفحه ورود | گالری سان تایم</title>
</head>

<body>
    <main class="auth-page">

        <section class="auth-card">

            <!-- =========================
                 Auth Header
            ========================== -->

            <header class="auth-header">

                <div class="auth-icon" aria-hidden="true">
                    <img src="../../assets/img/svg/st p1.svg" alt="">

                </div>

                <h1>ورود به حساب</h1>

                <p>خوش برگشتید</p>

            </header>


            <!-- =========================
                 Login Form
            ========================== -->

            <form class="auth-form" id="loginForm" novalidate>

                <!-- Email -->

                <div class="form-group">

                    <label for="loginEmail">
                        ایمیل
                    </label>

                    <input type="email" id="loginEmail" name="email" placeholder="example@email.com"
                        autocomplete="email" required>

                </div>


                <!-- Password -->

                <div class="form-group">

                    <label for="loginPassword">
                        رمز عبور
                    </label>

                    <div class="password-wrapper">

                        <input type="password" id="loginPassword" name="password" placeholder="رمز عبور"
                            autocomplete="current-password" required>

                        <button type="button" class="password-toggle" id="toggleLoginPassword"
                            aria-label="نمایش رمز عبور" aria-pressed="false">

                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                                xmlns="http://www.w3.org/2000/svg">

                                <path d="M2 12C2 12 5.5 5 12 5C18.5 5 22 12 22 12C22 12 18.5 19 12 19C5.5 19 2 12 2 12Z"
                                    stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" />

                                <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.7" />

                            </svg>

                        </button>

                    </div>

                </div>


                <!-- Forgot Password -->

                <div class="forgot-password">

                    <a href="./ForgetPassword.html">
                        فراموشی رمز عبور؟
                    </a>

                </div>


                <!-- Login Button -->

                <button type="submit" class="auth-submit" id="loginSubmit">
                    ورود
                </button>

            </form>


            <!-- =========================
                 Auth Footer
            ========================== -->

            <footer class="auth-footer">

                <span>
                    حساب ندارید؟
                </span>

                <a href="./Sign-Up.html">
                    ثبت‌نام کنید
                </a>

            </footer>

        </section>
        <div class="bubbles">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
        </div>
    </main>
  

</body>
</html>
