<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="../../assets/img/svg/st p1.svg">
    <link rel="stylesheet" href="../../styles/base/font.css">
    <link rel="stylesheet" href="../../styles/features/auth/auth.css">
    <link rel="stylesheet" href="../../assets/vendor/fontawesome/css/all.min.css">
    <title>صفحه ثبت نام | گالری سان تایم</title>
</head>

<body>

    <body>

        <main class="auth-page">

            <section class="auth-card auth-card--signup">

                <!-- Header -->
                <div class="auth-header">

                    <div class="auth-icon">
                       <img src="../../assets/img/svg/st p1.svg" alt="">
                    </div>

                    <h1>ایجاد حساب</h1>

                    <p>برای شروع حساب خود را بسازید</p>

                </div>


                <!-- Form -->
                <form class="auth-form">

                    <!-- Name -->
                    <div class="form-group">
                        <label for="signup-name">
                            نام
                        </label>
                        <input type="text" id="signup-name" name="name" placeholder="نام خود را وارد کنید"
                            autocomplete="name" required>
                    </div>


                    <!-- Email -->
                    <div class="form-group">

                        <label for="signup-email">
                            ایمیل
                        </label>

                        <input type="email" id="signup-email" name="email" placeholder="example@email.com"
                            autocomplete="email" required>

                    </div>


                    <!-- Password -->
                    <div class="form-group">

                        <label for="signup-password">
                            رمز عبور
                        </label>

                        <div class="password-wrapper">

                            <input type="password" id="signup-password" name="password" placeholder="رمز عبور"
                                autocomplete="new-password" required>

                            <button type="button" class="password-toggle" aria-label="نمایش رمز عبور">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                                    <path
                                        d="M2 12C2 12 5.5 5 12 5C18.5 5 22 12 22 12C22 12 18.5 19 12 19C5.5 19 2 12 2 12Z"
                                        stroke="currentColor" stroke-width="1.7" />

                                    <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.7" />
                                </svg>
                            </button>

                        </div>

                    </div>


                    <!-- Confirm Password -->
                    <div class="form-group">

                        <label for="signup-confirm-password">
                            تکرار رمز عبور
                        </label>

                        <div class="password-wrapper">

                            <input type="password" id="signup-confirm-password" name="confirmPassword"
                                placeholder="تکرار رمز عبور" autocomplete="new-password" required>

                            <button type="button" class="password-toggle" aria-label="نمایش رمز عبور">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                                    <path
                                        d="M2 12C2 12 5.5 5 12 5C18.5 5 22 12 22 12C22 12 18.5 19 12 19C5.5 19 2 12 2 12Z"
                                        stroke="currentColor" stroke-width="1.7" />

                                    <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.7" />
                                </svg>
                            </button>

                        </div>

                    </div>


                    <!-- Submit -->
                    <button type="submit" class="auth-submit">
                        ثبت‌نام
                    </button>

                </form>


                <!-- Footer -->
                <div class="auth-footer">

                    <span>قبلاً حساب ساخته‌اید؟</span>

                    <a href="./Sign-In.html">
                        وارد شوید
                    </a>

                </div>

            </section>
            <div class="bubbles">
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
            </div>

        </main>

        <script src="..\..\src\features\auth\signUp.js"></script>
    </body>
</html>
